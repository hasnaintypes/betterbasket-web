name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for turbo's --filter=...[origin/main]

      - uses: pnpm/action-setup@v4 # version comes from package.json's "packageManager" field

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, type-check, test, build (affected only on PRs)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo run lint type-check test build --filter="...[origin/${{ github.base_ref }}]"
          else
            pnpm turbo run lint type-check test build
          fi
