name: Bug report
description: Something behaves incorrectly
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened and what was expected }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce, description: Minimal steps; no secrets or real customer data }
    validations: { required: true }
  - type: textarea
    id: env
    attributes: { label: Environment and request id, description: Service, environment, commit, X-Request-Id if available }
  - type: textarea
    id: security
    attributes: { label: Security impact, description: "If this looks like a security vulnerability, do NOT describe exploit details here; report it privately to the maintainer." }
